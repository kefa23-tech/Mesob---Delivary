name: Mesob CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    name: OpenAPI validation and generated client drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - name: Validate OpenAPI schema and generated clients
        run: npm run check
        working-directory: api

  backend:
    name: Go lint, architecture, unit, and E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: backend
          args: --timeout=5m ./...
      - name: Unit tests
        run: go test -race ./...
        working-directory: backend
      - name: PostGIS and Redis lifecycle E2E
        run: go test -race -tags=e2e ./tests/e2e/...
        working-directory: backend

  frontend:
    name: Frontend ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-app, frontend-admin]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - name: ESLint and Clean Architecture boundaries
        run: npx eslint .
        working-directory: ${{ matrix.app }}
      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: ${{ matrix.app }}
      - name: Next.js production build
        run: npm run build
        working-directory: ${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: https://mesob.example/api/v1

  docker-build:
    name: Production multi-service image build
    runs-on: ubuntu-latest
    needs: [api-contract, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production Compose and monitoring configuration
        env:
          MESOB_DOMAIN: mesob.example.test
          ADMIN_DOMAIN: admin.mesob.example.test
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_USER: mesob
          POSTGRES_DB: mesob
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
          DATABASE_URL: postgres://mesob:ci-postgres-password@postgres:5432/mesob?sslmode=disable
          REDIS_URL: redis://redis:6379
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          docker run --rm \
            --entrypoint=/bin/promtool \
            -v "${GITHUB_WORKSPACE}/deploy/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.8.0 \
            check config /etc/prometheus/prometheus.yml
          jq -e . deploy/monitoring/mesob-production.json > /dev/null
      - name: Build production services
        env:
          MESOB_DOMAIN: mesob.example.test
          ADMIN_DOMAIN: admin.mesob.example.test
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_USER: mesob
          POSTGRES_DB: mesob
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
          DATABASE_URL: postgres://mesob:ci-postgres-password@postgres:5432/mesob?sslmode=disable
          REDIS_URL: redis://redis:6379
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
        run: docker compose -f docker-compose.prod.yml build
