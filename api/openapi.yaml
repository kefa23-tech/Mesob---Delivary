openapi: 3.1.0
info:
  title: Mesob Platform API
  version: 1.0.0
  description: Master contract for customer, partner, courier, and platform operations.
servers:
  - url: https://api.mesob.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Catalog
  - name: Group Cart
  - name: Orders
  - name: Payments
  - name: Partner
  - name: Admin
  - name: Courier
paths:
  /auth/otp/request:
    post:
      tags: [Authentication]
      security: []
      operationId: requestOtp
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } }
      responses:
        '202': { description: OTP delivery accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/otp/verify:
    post:
      tags: [Authentication]
      security: []
      operationId: verifyOtp
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyRequest' } } }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Authentication]
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } }
      responses:
        '200': { description: Refreshed session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '204': { description: Session revoked }
  /restaurants:
    get:
      tags: [Catalog]
      security: []
      operationId: listRestaurants
      parameters: [{ $ref: '#/components/parameters/Lat' }, { $ref: '#/components/parameters/Lng' }, { $ref: '#/components/parameters/Cuisine' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/EcoPackaging' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Restaurants, content: { application/json: { schema: { $ref: '#/components/schemas/RestaurantPage' } } } } }
  /restaurants/{id}/menu:
    get:
      tags: [Catalog]
      security: []
      operationId: getRestaurantMenu
      parameters: [{ $ref: '#/components/parameters/RestaurantId' }]
      responses: { '200': { description: Restaurant menu, content: { application/json: { schema: { $ref: '#/components/schemas/Menu' } } } } }
  /group-carts:
    post:
      tags: [Group Cart]
      operationId: createGroupCart
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGroupCartRequest' } } } }
      responses: { '201': { description: Created group cart, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
    get:
      tags: [Group Cart]
      operationId: listGroupCarts
      responses: { '200': { description: Group carts, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/GroupCart' } } } } } } } }
  /group-carts/{token}:
    get:
      tags: [Group Cart]
      security: []
      operationId: getGroupCart
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      responses: { '200': { description: Current group cart, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /group-carts/{token}/items:
    post:
      tags: [Group Cart]
      security: []
      operationId: addGroupCartItem
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddGroupCartItemRequest' } } } }
      responses: { '201': { description: Item added, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
  /group-carts/{token}/items/{item_id}:
    delete:
      tags: [Group Cart]
      security: []
      operationId: removeGroupCartItem
      parameters: [{ $ref: '#/components/parameters/CartToken' }, { $ref: '#/components/parameters/CartItemId' }]
      responses: { '200': { description: Item removed, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
  /group-carts/{token}/lock:
    post:
      tags: [Group Cart]
      security: []
      operationId: lockGroupCart
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      responses: { '200': { description: Cart locked, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } } }
      responses:
        '201': { description: Created order or cached replay, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Idempotency key is in flight, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Restaurant, delivery area, item, or stock validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Orders]
      operationId: listOrders
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses: { '200': { description: Orders, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } } }
  /orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrderTrackingSnapshot
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: Current state, visible only to the customer who owns the order, content: { application/json: { schema: { $ref: '#/components/schemas/OrderTrackingSnapshot' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{id}/stream:
    get:
      tags: [Orders]
      operationId: streamOrderTracking
      description: Authenticated Server-Sent Events; emits a snapshot first, then typed order events, with 15 second keep-alive comments.
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: Snapshot and live order events, content: { text/event-stream: { schema: { type: string, description: 'SSE frames: event: snapshot followed by typed OrderRealtimeEvent data frames.' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /payments/{order_id}/initialize:
    post:
      tags: [Payments]
      operationId: initializeOrderPayment
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { return_url: { type: string, format: uri } } } } } }
      responses:
        '201': { description: Hosted payment checkout, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentInitialization' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Order cannot be paid or gateway initialization failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /payments/webhook/chapa:
    post:
      tags: [Payments]
      security: []
      operationId: chapaPaymentWebhook
      parameters: [{ name: x-chapa-signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Event accepted }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { description: Invalid webhook signature }, '422': { description: Payment event rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /payments/webhook/telebirr:
    post:
      tags: [Payments]
      security: []
      operationId: telebirrPaymentWebhook
      parameters: [{ name: x-telebirr-signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Event accepted }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { description: Invalid webhook signature }, '422': { description: Payment event rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /dashboard/restaurant:
    get:
      tags: [Partner]
      operationId: getRestaurantDashboard
      responses: { '200': { description: Restaurant dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/RestaurantDashboard' } } } } }
  /dashboard/restaurant/orders:
    get:
      tags: [Partner]
      operationId: listRestaurantKitchenOrders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Active restaurant kitchen orders, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/KitchenOrder' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard/restaurant/stream:
    get:
      tags: [Partner]
      operationId: streamRestaurantKitchenEvents
      security: [{ bearerAuth: [] }]
      description: Authenticated SSE snapshot followed by live restaurant order events.
      responses: { '200': { description: Active orders and typed live events, content: { text/event-stream: { schema: { type: string } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /dashboard/restaurant/orders/{id}/accept:
    post:
      tags: [Partner]
      operationId: acceptRestaurantKitchenOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RestaurantOrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AcceptRestaurantOrderRequest' } } } }
      responses: { '200': { description: Order accepted, content: { application/json: { schema: { $ref: '#/components/schemas/KitchenOrder' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: Order is no longer awaiting acceptance } }
  /dashboard/restaurant/orders/{id}/preparing:
    post:
      tags: [Partner]
      operationId: startRestaurantKitchenOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RestaurantOrderId' }]
      responses: { '200': { description: Order is being prepared, content: { application/json: { schema: { $ref: '#/components/schemas/KitchenOrder' } } } }, '409': { description: Invalid state transition } }
  /dashboard/restaurant/orders/{id}/reject:
    post:
      tags: [Partner]
      operationId: rejectRestaurantKitchenOrder
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RestaurantOrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RejectRestaurantOrderRequest' } } } }
      responses: { '200': { description: Order rejected }, '409': { description: Invalid state transition } }
  /dashboard/restaurant/orders/{id}/ready:
    post:
      tags: [Partner]
      operationId: markRestaurantKitchenOrderReady
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RestaurantOrderId' }]
      responses: { '200': { description: Order ready for courier pickup, content: { application/json: { schema: { $ref: '#/components/schemas/KitchenOrder' } } } }, '409': { description: Invalid state transition } }
  /courier:
    get:
      tags: [Courier]
      operationId: getCourierDashboard
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Courier dashboard and active delivery, content: { application/json: { schema: { $ref: '#/components/schemas/CourierDashboard' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /courier/events/stream:
    get:
      tags: [Courier]
      operationId: streamCourierEvents
      security: [{ bearerAuth: [] }]
      description: Authenticated SSE snapshot followed by courier availability, offer, delivery, and GPS events.
      responses: { '200': { description: Courier snapshot and live events, content: { text/event-stream: { schema: { type: string } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /courier/status:
    post:
      tags: [Courier]
      operationId: updateCourierStatus
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CourierStatusRequest' } } } }
      responses: { '200': { description: Availability updated }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { description: Invalid courier status } }
  /courier/location:
    post:
      tags: [Courier]
      operationId: updateCourierLocation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CourierLocationRequest' } } } }
      responses: { '202': { description: Location and heartbeat updated }, '401': { $ref: '#/components/responses/Unauthorized' }, '422': { description: Invalid coordinates or courier unavailable } }
  /courier/offers:
    get:
      tags: [Courier]
      operationId: listCourierOffers
      responses: { '200': { description: Active offers, content: { application/json: { schema: { $ref: '#/components/schemas/CourierOffersResponse' } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /courier/offers/stream:
    get:
      tags: [Courier]
      operationId: streamCourierOffers
      description: Server-sent events; each offer is emitted as an `offer` event with a CourierOffer JSON payload.
      responses: { '200': { description: Live courier offer events, content: { text/event-stream: { schema: { type: string } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /courier/offers/{order_id}:
    get:
      tags: [Courier]
      operationId: getCourierOfferDetails
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Offer details for the assigned courier, content: { application/json: { schema: { $ref: '#/components/schemas/CourierOfferDetails' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '410': { description: Offer expired or unavailable } }
  /courier/offers/{order_id}/accept:
    post:
      tags: [Courier]
      operationId: acceptCourierOffer
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Order claimed }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Order already claimed or courier ineligible }, '410': { description: Offer expired } }
  /courier/deliveries/{order_id}/pickup:
    post:
      tags: [Courier]
      operationId: pickupCourierDelivery
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '200': { description: Delivery marked picked up }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Invalid delivery transition } }
  /courier/deliveries/{order_id}/complete:
    post:
      tags: [Courier]
      operationId: completeCourierDelivery
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CompleteDeliveryRequest' } } } }
      responses: { '200': { description: Delivery completed and settlement recorded }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Invalid delivery transition }, '422': { description: Invalid delivery PIN } }
  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      responses: { '200': { description: User list, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } } }
  /admin/overview:
    get:
      tags: [Admin]
      operationId: adminOperationsOverview
      responses: { '200': { description: Daily GMV and current order and dispatch counts, content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } } }, '403': { description: Active administrator role required } }
  /admin/kyc/pending:
    get:
      tags: [Admin]
      operationId: adminPendingKYC
      responses: { '200': { description: Pending restaurant and courier verification, content: { application/json: { schema: { $ref: '#/components/schemas/AdminKYCQueue' } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Active administrator role required } }
  /admin/kyc/{entity_type}/{id}/review:
    post:
      tags: [Admin]
      operationId: adminReviewKYC
      parameters:
        - { name: entity_type, in: path, required: true, schema: { type: string, enum: [restaurant, courier] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminKYCReviewRequest' } } } }
      responses: { '200': { description: KYC review recorded }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: Active administrator role required }, '404': { $ref: '#/components/responses/NotFound' } }
  /admin/orders/stuck:
    get:
      tags: [Admin]
      operationId: adminListStuckOrders
      parameters: [{ name: sla_minutes, in: query, schema: { type: integer, minimum: 1, maximum: 1440, default: 20 } }]
      responses: { '200': { description: Orders beyond dispatch SLA or marked for manual intervention, content: { application/json: { schema: { $ref: '#/components/schemas/AdminStuckOrderPage' } } } }, '403': { description: Active administrator role required } }
  /admin/orders/{id}/manual-assign:
    post:
      tags: [Admin]
      operationId: adminManuallyAssignCourier
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminManualAssignRequest' } } } }
      responses: { '200': { description: Courier assigned to an eligible order }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { description: Active administrator role required }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: Order or courier is no longer eligible } }
  /admin/orders/{id}/resolve-dispute:
    post:
      tags: [Admin]
      operationId: adminResolveOrderDispute
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminResolveDisputeRequest' } } } }
      responses: { '200': { description: Resolution, balanced ledger reversal, inventory restoration when cancelled }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { description: Active administrator role required }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: Order cannot be changed in its current state } }
  /admin/ledger/summary:
    get:
      tags: [Admin]
      operationId: adminLedgerSummary
      responses: { '200': { description: System balances and global signed-line invariant, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLedgerSummary' } } } }, '403': { description: Active administrator role required } }
  /admin/ledger/entries:
    get:
      tags: [Admin]
      operationId: adminLedgerEntries
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: account_type, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: Filterable ledger entries and journal lines, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLedgerPage' } } } }, '403': { description: Active administrator role required } }
  /admin/couriers/{id}/settle-cod:
    post:
      tags: [Admin]
      operationId: adminSettleCourierCOD
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminCODSettlementRequest' } } } }
      responses: { '200': { description: Remittance recorded and courier exposure reduced }, '400': { $ref: '#/components/responses/BadRequest' }, '403': { description: Active administrator role required }, '409': { description: Remittance exceeds outstanding courier cash } }
  /admin/disputes:
    get:
      tags: [Admin]
      operationId: adminListDisputes
      responses: { '200': { description: Dispute queue, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Dispute' } } } } } } } }
  /admin/disputes/{id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveDispute
      parameters: [{ $ref: '#/components/parameters/DisputeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveDisputeRequest' } } } }
      responses: { '200': { description: Resolved dispute, content: { application/json: { schema: { $ref: '#/components/schemas/Dispute' } } } } }
  /admin/dlq:
    get:
      tags: [Admin]
      operationId: adminListDeadLetterJobs
      responses: { '200': { description: Dead-letter jobs, content: { application/json: { schema: { type: object, properties: { depth: { type: integer }, jobs: { type: array, items: { $ref: '#/components/schemas/DeadLetterJob' } } } } } } } }
  /admin/dlq/{id}/replay:
    post:
      tags: [Admin]
      operationId: adminReplayDeadLetterJob
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses: { '202': { description: Replay accepted } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RestaurantId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    RestaurantOrderId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    DisputeId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CartToken: { name: token, in: path, required: true, schema: { type: string } }
    CartItemId: { name: item_id, in: path, required: true, schema: { type: string } }
    Lat: { name: lat, in: query, schema: { type: number, format: double } }
    Lng: { name: lng, in: query, schema: { type: number, format: double } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Cuisine: { name: cuisine, in: query, schema: { type: string } }
    Query: { name: q, in: query, schema: { type: string } }
    EcoPackaging: { name: eco_packaging, in: query, schema: { type: boolean } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Authentication failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    OtpRequest: { type: object, required: [phone], properties: { phone: { type: string, example: '+251911000000' }, channel: { type: string, enum: [sms, whatsapp], default: sms } } }
    OtpVerifyRequest: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, minLength: 4, maxLength: 8 } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, format: password } } }
