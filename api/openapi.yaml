openapi: 3.1.0
info:
  title: Mesob Platform API
  version: 1.0.0
  description: Master contract for customer, partner, courier, and platform operations.
servers:
  - url: https://api.mesob.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Catalog
  - name: Group Cart
  - name: Orders
  - name: Payments
  - name: Partner
  - name: Admin
  - name: Courier
paths:
  /auth/otp/request:
    post:
      tags: [Authentication]
      security: []
      operationId: requestOtp
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OtpRequest' } } }
      responses:
        '202': { description: OTP delivery accepted, content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /auth/otp/verify:
    post:
      tags: [Authentication]
      security: []
      operationId: verifyOtp
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OtpVerifyRequest' } } }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      operationId: login
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/LoginRequest' } } }
      responses:
        '200': { description: Authenticated session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Authentication]
      security: []
      operationId: refreshToken
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshRequest' } } }
      responses:
        '200': { description: Refreshed session, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      responses:
        '204': { description: Session revoked }
  /restaurants:
    get:
      tags: [Catalog]
      security: []
      operationId: listRestaurants
      parameters: [{ $ref: '#/components/parameters/Lat' }, { $ref: '#/components/parameters/Lng' }, { $ref: '#/components/parameters/Cuisine' }, { $ref: '#/components/parameters/Query' }, { $ref: '#/components/parameters/EcoPackaging' }, { $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Restaurants, content: { application/json: { schema: { $ref: '#/components/schemas/RestaurantPage' } } } } }
  /restaurants/{id}/menu:
    get:
      tags: [Catalog]
      security: []
      operationId: getRestaurantMenu
      parameters: [{ $ref: '#/components/parameters/RestaurantId' }]
      responses: { '200': { description: Restaurant menu, content: { application/json: { schema: { $ref: '#/components/schemas/Menu' } } } } }
  /group-carts:
    post:
      tags: [Group Cart]
      operationId: createGroupCart
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateGroupCartRequest' } } } }
      responses: { '201': { description: Created group cart, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
    get:
      tags: [Group Cart]
      operationId: listGroupCarts
      responses: { '200': { description: Group carts, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/GroupCart' } } } } } } } }
  /group-carts/{token}:
    get:
      tags: [Group Cart]
      security: []
      operationId: getGroupCart
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      responses: { '200': { description: Current group cart, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /group-carts/{token}/items:
    post:
      tags: [Group Cart]
      security: []
      operationId: addGroupCartItem
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddGroupCartItemRequest' } } } }
      responses: { '201': { description: Item added, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
  /group-carts/{token}/items/{item_id}:
    delete:
      tags: [Group Cart]
      security: []
      operationId: removeGroupCartItem
      parameters: [{ $ref: '#/components/parameters/CartToken' }, { $ref: '#/components/parameters/CartItemId' }]
      responses: { '200': { description: Item removed, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
  /group-carts/{token}/lock:
    post:
      tags: [Group Cart]
      security: []
      operationId: lockGroupCart
      parameters: [{ $ref: '#/components/parameters/CartToken' }]
      responses: { '200': { description: Cart locked, content: { application/json: { schema: { $ref: '#/components/schemas/GroupCartResponse' } } } } }
  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOrderRequest' } } } }
      responses:
        '201': { description: Created order or cached replay, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Idempotency key is in flight, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Restaurant, delivery area, item, or stock validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Orders]
      operationId: listOrders
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses: { '200': { description: Orders, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } } }
  /payments/{order_id}/initialize:
    post:
      tags: [Payments]
      operationId: initializeOrderPayment
      parameters: [{ name: order_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { return_url: { type: string, format: uri } } } } } }
      responses:
        '201': { description: Hosted payment checkout, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentInitialization' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { description: Order cannot be paid or gateway initialization failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /payments/webhook/chapa:
    post:
      tags: [Payments]
      security: []
      operationId: chapaPaymentWebhook
      parameters: [{ name: x-chapa-signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Event accepted }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { description: Invalid webhook signature }, '422': { description: Payment event rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /payments/webhook/telebirr:
    post:
      tags: [Payments]
      security: []
      operationId: telebirrPaymentWebhook
      parameters: [{ name: x-telebirr-signature, in: header, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses: { '200': { description: Event accepted }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { description: Invalid webhook signature }, '422': { description: Payment event rejected, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /dashboard/restaurant:
    get:
      tags: [Partner]
      operationId: getRestaurantDashboard
      responses: { '200': { description: Restaurant dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/RestaurantDashboard' } } } } }
  /courier:
    get:
      tags: [Courier]
      operationId: getCourierDashboard
      responses: { '200': { description: Courier dashboard, content: { application/json: { schema: { $ref: '#/components/schemas/CourierDashboard' } } } } }
  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      responses: { '200': { description: User list, content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } } } }
  /admin/disputes:
    get:
      tags: [Admin]
      operationId: adminListDisputes
      responses: { '200': { description: Dispute queue, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Dispute' } } } } } } } }
  /admin/disputes/{id}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveDispute
      parameters: [{ $ref: '#/components/parameters/DisputeId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResolveDisputeRequest' } } } }
      responses: { '200': { description: Resolved dispute, content: { application/json: { schema: { $ref: '#/components/schemas/Dispute' } } } } }
  /admin/dlq:
    get:
      tags: [Admin]
      operationId: adminListDeadLetterJobs
      responses: { '200': { description: Dead-letter jobs, content: { application/json: { schema: { type: object, properties: { depth: { type: integer }, jobs: { type: array, items: { $ref: '#/components/schemas/DeadLetterJob' } } } } } } } }
  /admin/dlq/{id}/replay:
    post:
      tags: [Admin]
      operationId: adminReplayDeadLetterJob
      parameters: [{ $ref: '#/components/parameters/JobId' }]
      responses: { '202': { description: Replay accepted } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    RestaurantId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    DisputeId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    CartToken: { name: token, in: path, required: true, schema: { type: string } }
    CartItemId: { name: item_id, in: path, required: true, schema: { type: string } }
    Lat: { name: lat, in: query, schema: { type: number, format: double } }
    Lng: { name: lng, in: query, schema: { type: number, format: double } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Cuisine: { name: cuisine, in: query, schema: { type: string } }
    Query: { name: q, in: query, schema: { type: string } }
    EcoPackaging: { name: eco_packaging, in: query, schema: { type: boolean } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unauthorized: { description: Authentication failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    OtpRequest: { type: object, required: [phone], properties: { phone: { type: string, example: '+251911000000' }, channel: { type: string, enum: [sms, whatsapp], default: sms } } }
    OtpVerifyRequest: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, minLength: 4, maxLength: 8 } } }
    LoginRequest: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string, format: password } } }
    RefreshRequest: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
    AuthResponse: { type: object, required: [access_token, refresh_token, user], properties: { access_token: { type: string }, refresh_token: { type: string }, expires_in: { type: integer }, user: { $ref: '#/components/schemas/User' } } }
    User: { type: object, required: [id, name, phone, role], properties: { id: { type: string, format: uuid }, name: { type: string }, phone: { type: string }, email: { type: string, format: email }, role: { type: string }, status: { type: string } } }
    Restaurant: { type: object, required: [id, name, is_open], properties: { id: { type: string, format: uuid }, name: { type: string }, lat: { type: number }, lng: { type: number }, is_open: { type: boolean }, delivery_radius_km: { type: number }, eco_packaging_certified: { type: boolean } } }
    RestaurantPage: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Restaurant' } }, page: { type: integer }, total: { type: integer } } }
    Menu: { type: object, required: [restaurant_id, restaurant_name, categories], properties: { restaurant_id: { type: string, format: uuid }, restaurant_name: { type: string }, categories: { type: array, items: { $ref: '#/components/schemas/MenuCategory' } } } }
    MenuCategory: { type: object, required: [id, name, items], properties: { id: { type: string, format: uuid }, name: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } } } }
    MenuItem: { type: object, required: [id, name, price_minor, is_available], properties: { id: { type: string, format: uuid }, name: { type: string }, description: { type: string }, image_url: { type: string, format: uri }, price_minor: { type: integer, format: int64 }, stock_limit: { type: integer }, is_available: { type: boolean }, option_groups: { type: array, items: { $ref: '#/components/schemas/OptionGroup' } } } }
    OptionGroup: { type: object, required: [id, name, min_select, max_select, options], properties: { id: { type: string, format: uuid }, name: { type: string }, min_select: { type: integer, minimum: 0 }, max_select: { type: integer, minimum: 0 }, options: { type: array, items: { $ref: '#/components/schemas/Option' } } } }
    Option: { type: object, required: [id, name, price_delta, is_available], properties: { id: { type: string, format: uuid }, name: { type: string }, price_delta: { type: integer, format: int64 }, is_available: { type: boolean } } }
    CreateGroupCartRequest: { type: object, required: [restaurant_id], properties: { restaurant_id: { type: string, format: uuid }, display_name: { type: string }, user_id: { type: string } } }
    AddGroupCartItemRequest: { type: object, required: [menu_item_id, restaurant_id, quantity], properties: { menu_item_id: { type: string, format: uuid }, restaurant_id: { type: string, format: uuid }, quantity: { type: integer, minimum: 1 }, options: { type: array, items: { $ref: '#/components/schemas/SelectedOption' } } } }
    SelectedOption: { type: object, required: [group_id, option_id, price_delta_minor], properties: { group_id: { type: string }, group_name: { type: string }, option_id: { type: string }, option_name: { type: string }, price_delta_minor: { type: integer, format: int64 } } }
    Participant: { type: object, required: [display_name], properties: { user_id: { type: string }, display_name: { type: string } } }
    ParticipantSummary: { type: object, required: [participant, subtotal_minor, delivery_fee_minor, total_minor], properties: { participant: { $ref: '#/components/schemas/Participant' }, subtotal_minor: { type: integer, format: int64 }, delivery_fee_minor: { type: integer, format: int64 }, total_minor: { type: integer, format: int64 } } }
    GroupCartItem: { type: object, required: [id, menu_item_id, name, unit_price_minor, quantity, participant, line_total_minor], properties: { id: { type: string }, menu_item_id: { type: string }, name: { type: string }, unit_price_minor: { type: integer, format: int64 }, quantity: { type: integer }, options: { type: array, items: { $ref: '#/components/schemas/SelectedOption' } }, participant: { $ref: '#/components/schemas/Participant' }, line_total_minor: { type: integer, format: int64 } } }
    GroupCart: { type: object, required: [token, restaurant_id, host, status, items, subtotal_minor, delivery_fee_minor, delivery_discount_minor, total_minor, participants], properties: { token: { type: string }, restaurant_id: { type: string, format: uuid }, host: { $ref: '#/components/schemas/Participant' }, status: { type: string, enum: [open, locked] }, items: { type: array, items: { $ref: '#/components/schemas/GroupCartItem' } }, subtotal_minor: { type: integer, format: int64 }, delivery_fee_minor: { type: integer, format: int64 }, delivery_discount_minor: { type: integer, format: int64 }, total_minor: { type: integer, format: int64 }, participants: { type: array, items: { $ref: '#/components/schemas/ParticipantSummary' } } } }
    GroupCartResponse: { type: object, required: [cart, share_url], properties: { cart: { $ref: '#/components/schemas/GroupCart' }, share_url: { type: string, format: uri } } }
    CreateOrderRequest: { type: object, required: [address_id, payment_method], properties: { address_id: { type: string, format: uuid }, payment_method: { type: string, enum: [TELEBIRR, CHAPA, COD] }, group_cart_token: { type: string }, items: { type: array, items: { $ref: '#/components/schemas/OrderItemInput' } } } }
    OrderItemInput: { type: object, required: [menu_item_id, quantity], properties: { menu_item_id: { type: string, format: uuid }, quantity: { type: integer, minimum: 1 }, options: { type: array, items: { $ref: '#/components/schemas/SelectedOption' } } } }
    OrderItem: { type: object, required: [id, menu_item_id, item_name, unit_price_minor, quantity, options, line_total_minor], properties: { id: { type: string, format: uuid }, menu_item_id: { type: string, format: uuid }, item_name: { type: string }, unit_price_minor: { type: integer, format: int64 }, quantity: { type: integer }, options: { type: array, items: { $ref: '#/components/schemas/SelectedOption' } }, line_total_minor: { type: integer, format: int64 } } }
    Order: { type: object, required: [id, user_id, restaurant_id, address_id, status, payment_method, payment_status, subtotal_minor, delivery_fee_minor, commission_minor, total_minor, currency, items, placed_at], properties: { id: { type: string, format: uuid }, user_id: { type: string, format: uuid }, restaurant_id: { type: string, format: uuid }, address_id: { type: string, format: uuid }, status: { type: string, enum: [pending, confirmed, preparing, ready, dispatched, delivered, cancelled] }, payment_method: { type: string, enum: [TELEBIRR, CHAPA, COD] }, payment_status: { type: string, enum: [pending, pending_payment, paid, payment_failed] }, subtotal_minor: { type: integer, format: int64 }, delivery_fee_minor: { type: integer, format: int64 }, commission_minor: { type: integer, format: int64 }, total_minor: { type: integer, format: int64 }, currency: { type: string, example: ETB }, items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }, placed_at: { type: string, format: date-time } } }
    PaymentInitialization: { type: object, required: [order_id, provider, reference, checkout_url], properties: { order_id: { type: string, format: uuid }, provider: { type: string, enum: [CHAPA, TELEBIRR] }, reference: { type: string }, checkout_url: { type: string, format: uri } } }
    OrderPage: { type: object, required: [data], properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, page: { type: integer }, total: { type: integer } } }
    RestaurantDashboard: { type: object, properties: { restaurant: { $ref: '#/components/schemas/Restaurant' }, pending_orders: { type: integer }, revenue_minor: { type: integer, format: int64 } } }
    CourierDashboard: { type: object, properties: { active_deliveries: { type: integer }, cash_balance_minor: { type: integer, format: int64 }, available: { type: boolean } } }
    UserPage: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/User' } }, total: { type: integer } } }
    Dispute: { type: object, required: [id, status], properties: { id: { type: string, format: uuid }, order_id: { type: string, format: uuid }, status: { type: string }, resolution: { type: string } } }
    ResolveDisputeRequest: { type: object, required: [resolution], properties: { resolution: { type: string }, refund_minor: { type: integer, format: int64, minimum: 0 } } }
    DeadLetterJob: { type: object, required: [id, job_type, status], properties: { id: { type: string, format: uuid }, job_type: { type: string }, status: { type: string }, error_message: { type: string }, attempts: { type: integer }, created_at: { type: string, format: date-time } } }
    MessageResponse: { type: object, properties: { message: { type: string } } }
    Error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, request_id: { type: string } } }
